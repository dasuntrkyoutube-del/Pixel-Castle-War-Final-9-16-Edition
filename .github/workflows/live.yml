name: YouTube Live Stream

on:
  workflow_dispatch: # GitHub එකෙන් manual ලයිව් එක Start කිරීමට

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies (FFmpeg & Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg xvfb libsdl2-dev

    - name: Install Python dependencies
      run: |
        pip install pygame pytchat

    - name: Start Game and Stream to YouTube
      env:
        YOUTUBE_VIDEO_ID: ${{ secrets.YOUTUBE_VIDEO_ID }}
        YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # Virtual Display එකක් Start කිරීම (720x1280 9:16 Portrait resolution)
        Xvfb :99 -screen 0 720x1280x24 > /dev/null 2>&1 &
        export DISPLAY=:99
        
        # Background එකෙන් Python ගේම් එක Run කිරීම
        python main.py &
        
        # තත්පර 5ක් ගේම් එක ලෝඩ් වෙන්න දීලා, FFmpeg හරහා YouTube RTMP එකට Stream කිරීම
        sleep 5
        ffmpeg -f x11grab -framerate 30 -video_size 720x1280 -i :99.0 \
               -c:v libx264 -preset veryfast -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 \
               -f flv rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY
